networkConfig:
  interfaces:
  # - name: lobrex
  #   type: loopback
  #   state: up
  #   ipv4:
  #     enabled: true
  #     address:
  #     - ip: "10.1.3.1"
  #       prefix-length: 31
  #     dhcp: false
  #   ipv6:
  #     enabled: false
  - name: eno8303
    type: ethernet
    state: up
    ipv4:
      enabled: false
    ipv6:
      enabled: false
  # - name: ens2f0
  #   type: ethernet
  #   state: up
  #   ipv4:
  #     address:
  #     - ip: "10.1.1.1"
  #       prefix-length: 31
  #     enabled: true
  - name: ens2f1
    type: ethernet
    state: up
    ipv4:
      address:
      - ip: "10.1.3.1"
        prefix-length: 31
      enabled: true
  dns-resolver:
    config:
      server:
      - 10.10.2.1
      - 10.10.1.1
  routes:
    config:
    # - destination: 0.0.0.0/0
    #   next-hop-address: 10.10.1.1
    #   next-hop-interface: ens2f0
    #   weight: 1
    - destination: 0.0.0.0/0
      next-hop-address: 10.10.2.1
      next-hop-interface: ens2f1
      weight: 1
